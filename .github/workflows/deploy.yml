name: Deploy

# Deploys the static landing page to https://memechat.dream-team.works on
# every push to master.
#
# How it works:
#   1. Stage the site (memechat-landing.html -> index.html + assets/).
#   2. Connect to the server through the Cloudflare Tunnel using an Access
#      service token, then rsync the staged files as the `deploy` user.
#
# Required repository secrets (see DEPLOY.md):
#   DEPLOY_SSH_KEY            private key of github-actions-memechat
#   CF_ACCESS_CLIENT_ID       Cloudflare Access service token ID
#   CF_ACCESS_CLIENT_SECRET   Cloudflare Access service token secret

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time; do not cancel a run that is already pushing files.
concurrency:
  group: deploy-memechat
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARED_VERSION: "2026.10.0"
  DEPLOY_HOST: admin.dream-team.works
  DEPLOY_USER: deploy
  DEPLOY_PATH: /var/www/memechat.dream-team.works

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets are configured
        run: |
          missing=0
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || { echo "::error::Secret DEPLOY_SSH_KEY is not set (see DEPLOY.md)"; missing=1; }
          [ -n "${{ secrets.CF_ACCESS_CLIENT_ID }}" ] || { echo "::error::Secret CF_ACCESS_CLIENT_ID is not set (see DEPLOY.md)"; missing=1; }
          [ -n "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" ] || { echo "::error::Secret CF_ACCESS_CLIENT_SECRET is not set (see DEPLOY.md)"; missing=1; }
          exit $missing

      - name: Stage static site
        run: |
          test -s memechat-landing.html
          mkdir -p _site
          cp memechat-landing.html _site/index.html
          cp -r assets _site/assets
          echo "Staged $(find _site -type f | wc -l) files"

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<SSH_CONFIG
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h
          SSH_CONFIG

      - name: Deploy via rsync
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          rsync -az --delete --chmod=D755,F644 -e ssh ./_site/ "deploy-target:${DEPLOY_PATH}/"

      - name: Smoke test
        run: |
          ok=0
          for i in $(seq 1 6); do
            if curl -fsS --max-time 15 "https://memechat.dream-team.works/" | grep -q "Meme Smarter, Not Harder"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Smoke test failed - the live page did not return the expected content"
            exit 1
          fi
          echo "Live page verified."
