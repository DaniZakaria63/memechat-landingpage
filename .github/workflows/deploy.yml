name: Deploy

# Deploys the static landing page to https://memechat.dream-team.works on
# every push to master.
#
# How it works:
#   1. Stage the site (memechat-landing.html -> index.html + assets/).
#   2. rsync the staged files to the server as the `deploy` user over
#      key-only SSH (direct IPv4 connection; no Cloudflare tunnel involved).
#
# Required repository secrets (see DEPLOY.md):
#   DEPLOY_SSH_KEY   private key of the github-actions-memechat deploy key
#
# Note: the Cloudflare Access service-token secrets (CF_ACCESS_CLIENT_ID /
# CF_ACCESS_CLIENT_SECRET) are no longer used and can be deleted.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time; do not cancel a run that is already pushing files.
concurrency:
  group: deploy-memechat
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 139.99.88.23
  DEPLOY_USER: deploy
  DEPLOY_PATH: /var/www/memechat.dream-team.works

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets are configured
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY is not set (see DEPLOY.md)"
            exit 1
          fi

      - name: Stage static site
        run: |
          test -s memechat-landing.html
          mkdir -p _site
          cp memechat-landing.html _site/index.html
          cp -r assets _site/assets
          echo "Staged $(find _site -type f | wc -l) files"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<SSH_CONFIG
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          SSH_CONFIG

      - name: Verify SSH connectivity
        run: ssh -o BatchMode=yes -o ConnectTimeout=15 deploy-target 'echo SSH_OK'

      - name: Deploy via rsync
        run: |
          rsync -az --delete --chmod=D755,F644 -e ssh ./_site/ "deploy-target:${DEPLOY_PATH}/"

      - name: Smoke test
        run: |
          ok=0
          for i in $(seq 1 6); do
            if curl -fsS --max-time 15 "https://memechat.dream-team.works/" | grep -q "Meme Smarter, Not Harder"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Smoke test failed - the live page did not return the expected content"
            exit 1
          fi
          echo "Live page verified."
